# Workflow publikacji leaderboardu. `bench-kit init`/`update` kopiuje go do
# .github/workflows/ instancji.
#
# Źródło prawdy: katalog `results/` w repo instancji (gałąź domyślna) —
# kanoniczne drzewo wyników (results/<zadanie>/<model>/trial-<n>/
# result.json + judge.json), zasilane lokalnie przez `bench evaluate`
# i commitowane przez operatora. Agregacja (mediany, pass@k, grupowanie
# w ery po stemplach) liczy się przy publikacji — `bench report` na całym
# drzewie. To już tylko statyczny build — GHA jako publikacja, nie jako
# substrat wykonania.
#
# Triggery:
# - push na gałąź domyślną dotykający results/ (= operator scommitował
#   wyniki): przebudowa i publikacja,
# - workflow_dispatch: ręczna przebudowa.
#
# Cele publikacji (wszystkie warunkowe, dashboard zawsze zostaje
# artefaktem `leaderboard-site`):
# - Cloudflare Pages — gdy ustawione sekrety CLOUDFLARE_API_TOKEN
#   (uprawnienie Cloudflare Pages: Edit) i CLOUDFLARE_ACCOUNT_ID;
#   nazwa projektu z repo variable CLOUDFLARE_PAGES_PROJECT (default:
#   nazwa repo). Działa niezależnie od widoczności repo GitHuba.
# - GitHub Pages — wymaga repo publicznego albo płatnego planu
#   (dla prywatnych); niedostępność wykrywana sondą, deploy pomijany
#   z komunikatem.

name: leaderboard

on:
  push:
    branches: [master, main]
    paths:
      - "results/**"
      - ".bench-kit/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .bench-kit/runner/package-lock.json
      - run: npm ci --prefix .bench-kit/runner

      # Historia dla dashboardu: jeden raport zsyntetyzowany z całego
      # drzewa results/ — `bench report` grupuje po erach (stemple
      # w result.json), więc stare i nowe ery nigdy się nie mieszają.
      - name: Zbuduj raport z results/
        run: |
          mkdir -p /tmp/history
          if [ -d results ] && find results -name result.json | grep -q .; then
            npm run bench --prefix .bench-kit/runner --silent -- report \
              --root "$GITHUB_WORKSPACE" --run "$GITHUB_WORKSPACE/results" \
              --out /tmp/history/results.json
          else
            echo "::error::brak wyników w results/ — nie ma z czego zbudować dashboardu"
            exit 1
          fi

      # --root: dashboard pokazuje wyłącznie zadania istniejące w tasks/
      # instancji — historia zadań usuniętych zostaje w gicie, ale nie
      # zaśmieca UI.
      - name: bench leaderboard
        run: |
          npm run bench --prefix .bench-kit/runner --silent -- leaderboard \
            --history /tmp/history --out "$GITHUB_WORKSPACE/site" \
            --root "$GITHUB_WORKSPACE" \
            --title "${{ github.event.repository.name }} — benchmark agentów AI"

      # Dashboard zawsze zostaje artefaktem — Pages to publikacja, nie źródło.
      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard-site
          path: site

      - name: Deploy na Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || github.event.repository.name }}
        run: |
          npx --yes wrangler pages project create "$PAGES_PROJECT" --production-branch=master >/dev/null 2>&1 || true
          npx --yes wrangler pages deploy site --project-name="$PAGES_PROJECT" --branch=master

      - name: Sonda dostępności Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "/repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1 ||
             gh api -X POST "/repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages niedostępne (repo prywatne na darmowym planie?) — dashboard tylko jako artefakt leaderboard-site"
          fi

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.pages.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
