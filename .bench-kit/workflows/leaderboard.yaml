# Workflow publikacji leaderboardu. `bench-kit init`/`update` kopiuje go do
# .github/workflows/ instancji.
#
# Źródło prawdy: gałąź `bench-data`.
# - `results/` — kanoniczne drzewo wyników (result.json kluczowane treścią:
#   zadanie / era / model / próba), zasilane PR-ami z workflow bench-cell,
#   które merguje owner benchmarku. Agregacja (mediany, pass@k) liczy się
#   tutaj, przy publikacji — `bench report` na całym drzewie.
# - `runs/<run_id>.json` — raporty LEGACY sprzed modelu per komórka;
#   zostają na gałęzi i dalej zasilają historię er dashboardu.
#
# Triggery:
# - push na bench-data (= merge PR-a z wynikami): przebudowa i publikacja,
# - workflow_dispatch: ręczna przebudowa.
#
# Cele publikacji (wszystkie warunkowe, dashboard zawsze zostaje
# artefaktem `leaderboard-site`):
# - Cloudflare Pages — gdy ustawione sekrety CLOUDFLARE_API_TOKEN
#   (uprawnienie Cloudflare Pages: Edit) i CLOUDFLARE_ACCOUNT_ID;
#   nazwa projektu z repo variable CLOUDFLARE_PAGES_PROJECT (default:
#   nazwa repo). Działa niezależnie od widoczności repo GitHuba.
# - GitHub Pages — wymaga repo publicznego albo płatnego planu
#   (dla prywatnych); niedostępność wykrywana sondą, deploy pomijany
#   z komunikatem.

name: leaderboard

on:
  push:
    branches: [bench-data]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Instancja (runner + config) z gałęzi domyślnej — push-event
      # wskazuje bench-data, więc ref jawnie.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .bench-kit/runner/package-lock.json
      - run: npm ci --prefix .bench-kit/runner

      - uses: actions/checkout@v4
        with:
          ref: bench-data
          path: data

      # Historia dla dashboardu: raporty legacy (runs/) + jeden raport
      # zsyntetyzowany z całego drzewa results/ — `bench report` grupuje
      # po erach, więc stare i nowe ery nigdy się nie mieszają.
      - name: Zbuduj historię raportów
        run: |
          mkdir -p /tmp/history
          if compgen -G "data/runs/*.json" >/dev/null; then
            cp data/runs/*.json /tmp/history/
            echo "legacy: $(ls data/runs/*.json | wc -l) raport(ów) z runs/"
          fi
          if [ -d data/results ] && find data/results -name result.json | grep -q .; then
            npm run bench --prefix .bench-kit/runner --silent -- report \
              --root "$GITHUB_WORKSPACE" --run "$GITHUB_WORKSPACE/data/results" \
              --out /tmp/history/results.json
          fi
          if ! compgen -G "/tmp/history/*.json" >/dev/null; then
            echo "::error::bench-data bez wyników (ani results/, ani runs/) — nie ma z czego zbudować dashboardu"
            exit 1
          fi

      # --root: dashboard pokazuje wyłącznie zadania istniejące w tasks/
      # instancji — historia zadań usuniętych zostaje na bench-data, ale
      # nie zaśmieca UI.
      - name: bench leaderboard
        run: |
          npm run bench --prefix .bench-kit/runner --silent -- leaderboard \
            --history /tmp/history --out "$GITHUB_WORKSPACE/site" \
            --root "$GITHUB_WORKSPACE" \
            --title "${{ github.event.repository.name }} — benchmark agentów AI"

      # Dashboard zawsze zostaje artefaktem — Pages to publikacja, nie źródło.
      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard-site
          path: site

      - name: Deploy na Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || github.event.repository.name }}
        run: |
          npx --yes wrangler pages project create "$PAGES_PROJECT" --production-branch=master >/dev/null 2>&1 || true
          npx --yes wrangler pages deploy site --project-name="$PAGES_PROJECT" --branch=master

      - name: Sonda dostępności Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "/repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1 ||
             gh api -X POST "/repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages niedostępne (repo prywatne na darmowym planie?) — dashboard tylko jako artefakt leaderboard-site"
          fi

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.pages.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
