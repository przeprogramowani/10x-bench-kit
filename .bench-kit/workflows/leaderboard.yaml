# Workflow publikacji leaderboardu. `bench-kit init`/`update` kopiuje go do
# .github/workflows/ instancji.
#
# Historia jest TRWAŁA: każdy report.json ląduje na gałęzi `bench-data`
# (runs/<run_id>.json) — artefakty CI wygasają, gałąź nie. Dashboard buduje
# `bench leaderboard` z całej gałęzi i publikuje na GitHub Pages.
#
# Cele publikacji (wszystkie warunkowe, dashboard zawsze zostaje
# artefaktem `leaderboard-site`):
# - Cloudflare Pages — gdy ustawione sekrety CLOUDFLARE_API_TOKEN
#   (uprawnienie Cloudflare Pages: Edit) i CLOUDFLARE_ACCOUNT_ID;
#   nazwa projektu z repo variable CLOUDFLARE_PAGES_PROJECT (default:
#   nazwa repo). Działa niezależnie od widoczności repo GitHuba.
# - GitHub Pages — wymaga repo publicznego albo płatnego planu
#   (dla prywatnych); niedostępność wykrywana sondą, deploy pomijany
#   z komunikatem.
#
# Triggery:
# - workflow_run po udanym bench-run: dokłada report tego runu i przebudowuje,
# - workflow_dispatch: backfill — dociąga raporty ze wszystkich udanych runów
#   bench-run, których artefakty jeszcze nie wygasły, i przebudowuje.

name: leaderboard

on:
  workflow_run:
    workflows: [bench-run]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write # push na gałąź bench-data
  actions: read # pobieranie artefaktów z runów bench-run
  pages: write
  id-token: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .bench-kit/runner/package-lock.json
      - run: npm ci --prefix .bench-kit/runner

      # Gałąź danych jako worktree: istniejąca albo świeży orphan.
      - name: Przygotuj gałąź bench-data
        run: |
          if git ls-remote --exit-code origin bench-data >/dev/null 2>&1; then
            # jawny ref zdalny — FETCH_HEAD jest per-worktree i nie istnieje w data/
            git fetch origin bench-data:refs/remotes/origin/bench-data
            git worktree add data refs/remotes/origin/bench-data
            git -C data checkout -B bench-data refs/remotes/origin/bench-data
          else
            git worktree add --detach data
            git -C data checkout --orphan bench-data
            git -C data rm -rf --quiet . || true
          fi
          mkdir -p data/runs

      - name: Zbierz report.json z runów bench-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          collect() { # <run_id> — pobiera artefakt report, jeśli jeszcze go nie mamy
            local id="$1"
            if [ -f "data/runs/${id}.json" ]; then return 0; fi
            local tmp; tmp="$(mktemp -d)"
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n report -D "$tmp" 2>/dev/null; then
              mv "$tmp/report.json" "data/runs/${id}.json"
              echo "dodano runs/${id}.json"
            else
              echo "run ${id}: brak artefaktu report (wygasł albo run bez aggregate) — pomijam"
            fi
          }
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            collect "${{ github.event.workflow_run.id }}"
          else
            for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow bench-run \
                --status success --limit 100 --json databaseId --jq '.[].databaseId'); do
              collect "$id"
            done
          fi

      - name: Wypchnij historię
        run: |
          cd data
          git add runs
          if git diff --cached --quiet; then
            echo "historia bez zmian"
          else
            git -c user.name="bench-kit" -c user.email="bench-kit@users.noreply.github.com" \
              commit -m "bench-data: raporty $(ls runs | wc -l | tr -d ' ') runów"
            git push origin bench-data
          fi

      # --root: dashboard pokazuje wyłącznie zadania istniejące w tasks/
      # instancji — historia zadań usuniętych zostaje na bench-data, ale
      # nie zaśmieca UI.
      - name: bench leaderboard
        run: |
          npm run bench --prefix .bench-kit/runner --silent -- leaderboard \
            --history "$GITHUB_WORKSPACE/data/runs" --out "$GITHUB_WORKSPACE/site" \
            --root "$GITHUB_WORKSPACE" \
            --title "${{ github.event.repository.name }} — benchmark agentów AI"

      # Dashboard zawsze zostaje artefaktem — Pages to publikacja, nie źródło.
      - uses: actions/upload-artifact@v4
        with:
          name: leaderboard-site
          path: site

      - name: Deploy na Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || github.event.repository.name }}
        run: |
          npx --yes wrangler pages project create "$PAGES_PROJECT" --production-branch=master >/dev/null 2>&1 || true
          npx --yes wrangler pages deploy site --project-name="$PAGES_PROJECT" --branch=master

      - name: Sonda dostępności Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "/repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1 ||
             gh api -X POST "/repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages niedostępne (repo prywatne na darmowym planie?) — dashboard tylko jako artefakt leaderboard-site"
          fi

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.pages.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
