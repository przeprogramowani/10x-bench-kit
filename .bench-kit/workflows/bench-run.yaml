# Orkiestrator runu benchmarku. `bench-kit init`/`update` kopiuje go do
# .github/workflows/ instancji.
#
# Model operacyjny: bench-run NIE wykonuje prób. Wylicza brakujące
# KOMÓRKI (model × zadanie) i dispatchuje per komórka niezależny run
# workflow bench-cell — każda komórka ma własny status w Actions,
# a jej wyniki wracają jako PR na gałąź bench-data (merguje owner
# benchmarku; merge wyzwala przebudowę leaderboardu).
#
# Rytuał: nowy model na rynku → dispatch z jego ID → paczka komórek.
# Wszystkie parametry mają defaults z bench.config.yaml.
#
# Skip-logic: run jest stateless w obrębie ery scoringu — komórki
# (model × zadanie) z żądaną liczbą prób w kanonicznym drzewie wyników
# (bench-data, results/) wypadają z listy, więc dispatch bez parametrów
# dogania tylko braki (nowe modele, nowe zadania, nowe ery). Drzewo
# widzi tylko wyniki ZMERGOWANE — merguj PR-y z wynikami przed kolejnym
# dispatchem, inaczej komórki z otwartymi PR-ami polecą drugi raz.
# Input `force` wymusza pełny re-run.
#
# Wymagane sekrety instancji: jak w bench-cell (tam wykonują się próby).

name: bench-run

# actions: write — dispatch workflow bench-cell przez GITHUB_TOKEN.
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Modele oceniane (CSV, np. openrouter/google/gemini-2.5-flash). Puste = defaults.models z bench.config.yaml"
        required: false
        type: string
      tasks:
        description: "Zadania (CSV nazw z tasks/). Puste = wszystkie"
        required: false
        type: string
      trials:
        description: "Prób na (model × zadanie). Puste = defaults.trials"
        required: false
        type: string
      parallel:
        description: "Równoczesne próby w komórce. Puste = defaults.parallel z bench.config.yaml"
        required: false
        type: string
      force:
        description: "Wymuś re-run: ignoruj wyniki z bench-data (skip-logic)"
        required: false
        type: boolean
        default: false

# Jeden orkiestrator naraz — drugi dispatch w trakcie planowania mógłby
# zdublować komórki (skip-logic nie widzi jeszcze niezmergowanych wyników).
concurrency:
  group: bench-run
  cancel-in-progress: false

env:
  # Parametry dispatch dokładane do komend tylko, gdy podane; inputy
  # wyłącznie przez env (wstrzyknięcie komend przy ręcznym dispatchu).
  MODELS_ARG: ${{ inputs.models != '' && format('--models {0}', inputs.models) || '' }}
  TASKS_ARG: ${{ inputs.tasks != '' && format('--tasks {0}', inputs.tasks) || '' }}
  TRIALS_ARG: ${{ inputs.trials != '' && format('--trials {0}', inputs.trials) || '' }}
  FORCE_ARG: ${{ inputs.force == true && '--force' || '' }}
  RUN_PARALLEL: ${{ inputs.parallel }}

jobs:
  # Bramka + plan + dispatch: validate musi przejść, zanim wydamy centa.
  plan:
    runs-on: ubuntu-latest
    env:
      BASE_REPO_TOKEN: ${{ secrets.BASE_REPO_TOKEN }}
    steps:
      # persist-credentials: false — checkout nie może zostawić w .git/config
      # nagłówka Authorization z GITHUB_TOKEN; git odpalany w workspace
      # wysyłałby go do repo bazowych zamiast BASE_REPO_TOKEN (url.insteadOf).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .bench-kit/runner/package-lock.json
      - run: npm ci --prefix .bench-kit/runner
      - name: bench validate
        run: npm run bench --prefix .bench-kit/runner --silent -- validate --root "$GITHUB_WORKSPACE"

      # Skip-logic: kanoniczne drzewo wyników z gałęzi bench-data pozwala
      # `bench matrix` wyciąć komórki z żądaną liczbą prób w bieżącej erze.
      # Brak gałęzi (pierwszy run) = bez skip-logic.
      - name: Drzewo wyników (bench-data)
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/bench-data" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "gałąź bench-data nie istnieje — lista komórek bez skip-logic"
          fi
      - uses: actions/checkout@v4
        if: steps.history.outputs.exists == 'true'
        with:
          ref: bench-data
          path: bench-data
          persist-credentials: false

      - name: bench matrix
        id: matrix
        run: |
          RESULTS_ARG=""
          if [ -d "$GITHUB_WORKSPACE/bench-data/results" ]; then
            RESULTS_ARG="--results $GITHUB_WORKSPACE/bench-data/results"
          fi
          MATRIX="$(npm run bench --prefix .bench-kit/runner --silent -- matrix --root "$GITHUB_WORKSPACE" $MODELS_ARG $TASKS_ARG $TRIALS_ARG $RESULTS_ARG $FORCE_ARG)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$MATRIX" | jq '.include | length')" >> "$GITHUB_OUTPUT"

      # Dispatch komórek: jeden run bench-cell per (model × zadanie).
      # Fire-and-forget — statusy komórek żyją w ich runach, wyniki wracają
      # PR-ami na bench-data. Retry per komórka (transient API GitHuba nie
      # może uciąć paczki w połowie); komórki, których dispatch ostatecznie
      # zawiódł, lądują IMIENNIE w summary i statusie — ślepy re-run całego
      # bench-run zdublowałby komórki już wystartowane (i ich koszt),
      # właściwa naprawa to ręczny dispatch bench-cell dla wymienionych.
      - name: Dispatch bench-cell
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ steps.matrix.outputs.matrix }}
          COUNT: ${{ steps.matrix.outputs.count }}
        run: |
          {
            echo "## bench-run → dispatch komórek"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" = "0" ]; then
            echo "wszystkie komórki zmierzone w bieżącej erze — nic do dispatchu"
            echo "Wszystkie komórki zmierzone w bieżącej erze — nic do dispatchu (force wymusza re-run)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "| komórka | model | zadanie | próby | dispatch |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          FAILED=""
          # jq → plik zamiast pipe do while: pętla nie może żyć w subshellu
          # (FAILED musi przetrwać), a `set -e` nie może ucinać paczki po
          # pierwszym błędzie dispatchu.
          jq -c '.include[]' <<< "$MATRIX" > /tmp/cells.jsonl
          while read -r cell; do
            MODEL="$(jq -r .model <<< "$cell")"
            TASK="$(jq -r .task <<< "$cell")"
            TRIALS="$(jq -r .trials <<< "$cell")"
            SLUG="$(jq -r .slug <<< "$cell")"
            ok=""
            for attempt in 1 2 3; do
              if gh workflow run bench-cell.yaml --ref "$GITHUB_REF_NAME" \
                  -f "model=$MODEL" -f "task=$TASK" -f "trials=$TRIALS" \
                  ${RUN_PARALLEL:+-f "parallel=$RUN_PARALLEL"}; then
                ok=1; break
              fi
              echo "dispatch $SLUG nieudany — ponawiam ($attempt/3)"; sleep $((attempt * 5))
            done
            if [ -n "$ok" ]; then
              echo "dispatch: $SLUG (trials=$TRIALS)"
              echo "| \`$SLUG\` | $MODEL | $TASK | $TRIALS | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              FAILED="$FAILED $SLUG"
              echo "::error::dispatch komórki $SLUG nieudany po 3 podejściach"
              echo "| \`$SLUG\` | $MODEL | $TASK | $TRIALS | ❌ |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < /tmp/cells.jsonl
          {
            echo
            echo "Komórek: **$COUNT**. Statusy w runach workflow **bench-cell**; wyniki wracają PR-ami na gałąź \`bench-data\` — merge ownera czyni je oficjalnymi i przebudowuje leaderboard."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FAILED" ]; then
            echo "NIE dispatchowano:$FAILED — odpal je ręcznie workflow bench-cell (NIE ponawiaj całego bench-run: zdublujesz komórki, które wystartowały)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
