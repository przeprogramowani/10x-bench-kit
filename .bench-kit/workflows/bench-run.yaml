# Workflow runu benchmarku. `bench-kit init`/`update` kopiuje go do
# .github/workflows/ instancji.
#
# Rytuał: nowy model na rynku → dispatch z jego ID → nowy wiersz w tabeli.
# Wszystkie parametry mają defaults z bench.config.yaml.
#
# Skip-logic: run jest stateless w obrębie ery scoringu — komórki
# (model × zadanie) z żądaną liczbą prób w historii (gałąź bench-data)
# wypadają z macierzy, więc dispatch bez parametrów dogania tylko braki
# (nowe modele, nowe zadania, nowe ery). Input `force` wymusza pełny
# re-run; więcej prób niż w historii = re-run komórki od zera.
#
# Wymagane sekrety instancji:
# - klucze API providerów używanych przez oceniane modele i sędziego
#   (np. OPENROUTER_API_KEY),
# - BASE_REPO_TOKEN — gdy którekolwiek repo bazowe jest prywatne:
#   fine-grained PAT (tylko contents:read) obejmujący wszystkie prywatne
#   base_repos. Wystarczy env — runner sam wpina token w git fetch/ls-remote
#   (url.insteadOf per wywołanie); do kontenerów prób nie trafia.
#   Przy samych repo publicznych sekret jest zbędny.

name: bench-run

# packages: write — obrazy (bazowy + zadań) idą przez GHCR pakietów repo:
# zbudowane raz, reużywane przez wszystkie joby i kolejne runy (pull warstw
# zamiast docker save/load tar przez actions/cache).
# contents: write — joby prób utrwalają result.json na gałęzi bench-data
# (partials/<run_id>/) od razu po ocenie; artefakty CI potrafią zniknąć
# (retencja, blokada billingowa w połowie runu), gałąź nie.
permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Modele oceniane (CSV, np. openrouter/google/gemini-2.5-flash). Puste = defaults.models z bench.config.yaml"
        required: false
        type: string
      tasks:
        description: "Zadania (CSV nazw z tasks/). Puste = wszystkie"
        required: false
        type: string
      trials:
        description: "Prób na (model × zadanie). Puste = defaults.trials"
        required: false
        type: string
      parallel:
        description: "Równoczesne próby w jobie zadania. Puste = defaults.parallel z bench.config.yaml"
        required: false
        type: string
      force:
        description: "Wymuś re-run: ignoruj wyniki z bench-data (skip-logic)"
        required: false
        type: boolean
        default: false

env:
  # Parametry dispatch dokładane do komend tylko, gdy podane.
  MODELS_ARG: ${{ inputs.models != '' && format('--models {0}', inputs.models) || '' }}
  TASKS_ARG: ${{ inputs.tasks != '' && format('--tasks {0}', inputs.tasks) || '' }}
  TRIALS_ARG: ${{ inputs.trials != '' && format('--trials {0}', inputs.trials) || '' }}
  PARALLEL_ARG: ${{ inputs.parallel != '' && format('--parallel {0}', inputs.parallel) || '' }}
  FORCE_ARG: ${{ inputs.force == true && '--force' || '' }}

jobs:
  # Bramka + macierz: validate musi przejść, zanim wydamy centa na próby.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    env:
      BASE_REPO_TOKEN: ${{ secrets.BASE_REPO_TOKEN }}
    steps:
      # persist-credentials: false — checkout nie może zostawić w .git/config
      # nagłówka Authorization z GITHUB_TOKEN; git odpalany w workspace
      # wysyłałby go do repo bazowych zamiast BASE_REPO_TOKEN (url.insteadOf).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .bench-kit/runner/package-lock.json
      - run: npm ci --prefix .bench-kit/runner
      - name: bench validate
        run: npm run bench --prefix .bench-kit/runner --silent -- validate --root "$GITHUB_WORKSPACE"

      # Skip-logic: benchmark jest stateless w obrębie ery scoringu. Historia
      # raportów z gałęzi bench-data pozwala `bench matrix` wyciąć komórki
      # (model × zadanie), które w bieżącej erze mają już żądaną liczbę prób —
      # dispatch bez parametrów dogania tylko braki. Input `force` = pełny
      # re-run; brak gałęzi (pierwszy run) = bez skip-logic.
      - name: Historia wyników (bench-data)
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/bench-data" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "gałąź bench-data nie istnieje — macierz bez skip-logic"
          fi
      - uses: actions/checkout@v4
        if: steps.history.outputs.exists == 'true'
        with:
          ref: bench-data
          path: bench-data
          persist-credentials: false

      - name: bench matrix
        id: matrix
        run: |
          HISTORY_ARG=""
          if [ "${{ steps.history.outputs.exists }}" = "true" ]; then
            HISTORY_ARG="--history $GITHUB_WORKSPACE/bench-data/runs"
          fi
          MATRIX="$(npm run bench --prefix .bench-kit/runner --silent -- matrix --batch --root "$GITHUB_WORKSPACE" $MODELS_ARG $TASKS_ARG $TRIALS_ARG $HISTORY_ARG $FORCE_ARG)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$MATRIX" | jq '.include | length')" >> "$GITHUB_OUTPUT"

  # Jeden job = jedno ZADANIE (macierz --batch): wszystkie jego modele ×
  # próby biegną w jednym jobie przez `bench run --parallel` — próba
  # spędza większość czasu na czekaniu na API modelu, więc job zbiorczy
  # płaci ~max(próba) job-minut zamiast sumy prób (kilkukrotnie mniej niż
  # job per próba przy tym samym wall-clocku). Obrazy (bazowy + zadań)
  # idą przez GHCR: joby po chybieniu budują i wypychają, kolejne
  # ściągają. Uwaga: awaria joba = re-run całej paczki zadania.
  trial:
    needs: plan
    # count 0 = wszystko już zmierzone w bieżącej erze (skip-logic) — job
    # pominięty zamiast wywrotki na pustej macierzy.
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BASE_REPO_TOKEN: ${{ secrets.BASE_REPO_TOKEN }}
      # Cache zależności ocen (N1) na katalogu hosta zamiast wolumenu —
      # wolumen żyje tylko przez czas joba, katalog przenosi actions/cache.
      BENCH_DEPS_CACHE_DIR: /tmp/bench-deps-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .bench-kit/runner/package-lock.json
      - run: npm ci --prefix .bench-kit/runner

      # Ciepły cache zależności między RUNAMI: klucz zawsze świeży (run_id),
      # restore-keys dociąga najnowszy zapis — cache akumuluje się w czasie.
      - name: Cache zależności ocen (bench-deps-cache)
        uses: actions/cache@v4
        with:
          path: /tmp/bench-deps-cache
          key: bench-deps-${{ runner.os }}-${{ github.run_id }}-${{ matrix.slug }}
          restore-keys: |
            bench-deps-${{ runner.os }}-

      # Obrazy przez GHCR zamiast docker save/load tar w actions/cache:
      # pull warstw jest szybszy i współdzielony między jobami oraz runami.
      # Tagi są treścią, nie czasem — hash wejść (Dockerfile/zadanie), więc
      # świeżość gwarantuje tag, a nie rebuild. Pull „na miękko": chybienie
      # (pierwszy run po zmianie) nie wywraca joba, tylko zostawia budowę
      # runnerowi; brak flag BENCH_REUSE_* = zbuduj normalnie.
      - name: Obrazy z rejestru (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          OPENCODE_VERSION="$(tr -d '[:space:]' < .bench-kit/docker/opencode.version)"
          BASE_HASH="${{ hashFiles('.bench-kit/docker/**') }}"
          TASK_HASH="${{ hashFiles(format('tasks/{0}/**', matrix.task), '.bench-kit/docker/**') }}"
          # TASK_SAFE odtwarza sanitize() runnera (run.ts) — lokalny tag musi
          # trafić w nazwę, której `bench run` szuka przy BENCH_REUSE_TASK_IMAGE.
          TASK_SAFE="$(echo "${{ matrix.task }}" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
          TASK_LC="$(echo "$TASK_SAFE" | tr '[:upper:]' '[:lower:]')"
          {
            echo "BASE_LOCAL=bench-base:${OPENCODE_VERSION}"
            echo "BASE_REMOTE=${REGISTRY}/bench-base:${BASE_HASH:0:16}"
            echo "TASK_LOCAL=bench-task-${TASK_SAFE}:latest"
            echo "TASK_REMOTE=${REGISTRY}/bench-task-${TASK_LC}:${TASK_HASH:0:16}"
          } >> "$GITHUB_ENV"
      - name: Wczytaj obrazy z rejestru
        run: |
          if docker pull -q "$BASE_REMOTE"; then
            docker tag "$BASE_REMOTE" "$BASE_LOCAL"
            echo "BENCH_REUSE_BASE_IMAGE=1" >> "$GITHUB_ENV"
          else
            echo "obraz bazowy: brak w rejestrze — runner zbuduje ($BASE_REMOTE)"
          fi
          if docker pull -q "$TASK_REMOTE"; then
            docker tag "$TASK_REMOTE" "$TASK_LOCAL"
            echo "BENCH_REUSE_TASK_IMAGE=1" >> "$GITHUB_ENV"
          else
            echo "obraz zadania: brak w rejestrze — runner zbuduje ($TASK_REMOTE)"
          fi

      - name: bench run
        run: |
          npm run bench --prefix .bench-kit/runner --silent -- run \
            --root "$GITHUB_WORKSPACE" \
            --models "${{ matrix.models }}" --tasks "${{ matrix.task }}" \
            --trials "${{ matrix.trials }}" $PARALLEL_ARG \
            --out "$GITHUB_WORKSPACE/out/run"
      - name: bench evaluate
        run: |
          npm run bench --prefix .bench-kit/runner --silent -- evaluate \
            --root "$GITHUB_WORKSPACE" --run "$GITHUB_WORKSPACE/out/run"

      # Wypchnięcie tylko obrazów zbudowanych w tym jobie (chybienie pull).
      # Równoległe joby zimnego runu wypychają ten sam tag — push jest
      # idempotentny; continue-on-error, bo brak uprawnień do pakietu nie
      # może unieważnić wyników próby.
      - name: Wypchnij obrazy do rejestru
        if: env.BENCH_REUSE_BASE_IMAGE != '1' || env.BENCH_REUSE_TASK_IMAGE != '1'
        continue-on-error: true
        run: |
          if [ "$BENCH_REUSE_BASE_IMAGE" != "1" ]; then
            docker tag "$BASE_LOCAL" "$BASE_REMOTE" && docker push -q "$BASE_REMOTE"
          fi
          if [ "$BENCH_REUSE_TASK_IMAGE" != "1" ]; then
            docker tag "$TASK_LOCAL" "$TASK_REMOTE" && docker push -q "$TASK_REMOTE"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.slug }}
          path: out/run
          if-no-files-found: warn

      # Utrwalenie wyników od razu po ocenie: result.json (jedyne, czego
      # potrzebuje `bench report`, kilka KB per próba) idzie na gałąź
      # bench-data pod partials/<run_id>/<slug>/ z zachowaniem układu
      # katalogów runu. Artefakty CI potrafią zniknąć (retencja, blokada
      # billingowa w połowie runu) — gałąź nie; aggregate scala artefakty
      # z partials, więc opłacone próby przeżywają awarię agregacji,
      # a "re-run failed jobs" odtwarza raport bez powtarzania prób.
      # Token tylko w konfiguracji klonu /tmp — kontenery prób dostają
      # wyłącznie *_API_KEY/OPENCODE_* i dawno nie żyją.
      - name: Utrwal wyniki (bench-data/partials)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -d out/run ] || ! find out/run -name result.json | grep -q .; then
            echo "brak result.json — nic do utrwalenia"
            exit 0
          fi
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          DEST="partials/${{ github.run_id }}/${{ matrix.slug }}"
          # Równoległe joby pchają na tę samą gałąź — przegrany wyścigu
          # klonuje od nowa i ponawia (rozłączne ścieżki, konflikt niemożliwy).
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/bench-data
            if ! git clone -q --depth 1 --branch bench-data "$REMOTE" /tmp/bench-data 2>/dev/null; then
              git init -q -b bench-data /tmp/bench-data
              git -C /tmp/bench-data remote add origin "$REMOTE"
            fi
            rm -rf "/tmp/bench-data/$DEST"
            mkdir -p "/tmp/bench-data/$DEST"
            (cd out/run && find . -name result.json -exec cp --parents {} "/tmp/bench-data/$DEST/" \;)
            git -C /tmp/bench-data add -A
            if git -C /tmp/bench-data diff --cached --quiet; then
              echo "partials bez zmian"
              exit 0
            fi
            git -C /tmp/bench-data -c user.name=bench-kit -c user.email=bench-kit@users.noreply.github.com \
              commit -q -m "bench-data: partials ${{ github.run_id }}/${{ matrix.slug }}"
            if git -C /tmp/bench-data push -q origin bench-data; then
              echo "utrwalono $DEST"
              exit 0
            fi
            echo "push odrzucony (wyścig jobów) — ponawiam ($attempt/5)"
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::nie udało się utrwalić wyników na bench-data po 5 podejściach"
          exit 1

  # Agregacja: mediana, pass@k, koszt runu → report.json jako artefakt.
  # (Leaderboard/dashboard celowo później — surowe JSON-y wystarczą.)
  aggregate:
    needs: [plan, trial]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .bench-kit/runner/package-lock.json
      - run: npm ci --prefix .bench-kit/runner
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: out/run
          merge-multiple: true

      # Drugie źródło wyników: partials tego runu z bench-data — te same
      # ścieżki względne co artefakty (nadpisanie idempotentne), więc
      # raport powstaje także wtedy, gdy artefakty przepadły (np. blokada
      # billingowa w połowie runu) — wystarczy "re-run failed jobs".
      - name: Uzupełnij wyniki z bench-data (partials)
        run: |
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 1 --branch bench-data "$REMOTE" /tmp/bench-data 2>/dev/null; then
            echo "gałąź bench-data nie istnieje — tylko artefakty"
            exit 0
          fi
          SRC="/tmp/bench-data/partials/${{ github.run_id }}"
          if [ ! -d "$SRC" ]; then
            echo "brak partials dla runu ${{ github.run_id }} — tylko artefakty"
            exit 0
          fi
          mkdir -p out/run
          for slug_dir in "$SRC"/*/; do
            cp -R "${slug_dir}." out/run/
          done
          echo "scalono partials: $(find "$SRC" -name result.json | wc -l) result.json"

      - name: bench report
        run: |
          npm run bench --prefix .bench-kit/runner --silent -- report \
            --root "$GITHUB_WORKSPACE" --run "$GITHUB_WORKSPACE/out/run"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: out/run/report.json
